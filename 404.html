<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 奇闻异事</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FBFAF6">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style-modern.css" id="css-modern">
    <link rel="stylesheet" href="/style-retro.css" id="css-retro" disabled>
    <link rel="stylesheet" href="/ui.css">
</head>
<body data-page="not-found" data-theme="modern">
    <div class="desktop-icons" aria-hidden="true">
        <a href="/index.html"><span class="ico">▤</span>我的电脑</a>
        <a href="/admin.html"><span class="ico">▣</span>档案区</a>
    </div>

    <div class="shell shell--narrow">
        <header class="mast mast--compact" data-window="404 - 奇闻异事">

            <nav class="top">
                <a href="/index.html">← 返回首页</a>
                <a href="/admin.html">档案区</a>
                <span class="spacer"></span>
                <button type="button" class="theme-switch" data-theme-toggle title="切换风格">
                    <span data-theme-label>风格</span>
                </button>
            </nav>
            <hr class="hairline">
        </header>

        <main class="feed" data-window="404 - 这一页不在档案里">
            <div class="detail" style="padding:26px 0 8px;">
                <p class="detail__kicker">ERROR 404</p>
                <h2 class="detail__title">这一页不在档案里</h2>

                <p class="detail__foot"><a href="/index.html">← 回到首页</a></p>
            </div>
        </main>

        <footer class="foot">
            <span>奇闻异事 · 民间怪谈存档</span>
            <span>404</span>
        </footer>
    </div>

    <div class="taskbar" aria-hidden="true">
        <span class="start"><span class="flag"></span>开始</span>
        <span class="task is-active">404</span>
        <span class="clock" id="clock">--:--</span>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
