<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂 聊天室？</title>

    <meta name="description" content="未公开的通讯窗口。">
    <meta name="theme-color" content="#FBFAF6">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="奇闻异事">
    <meta property="og:title" content="📂 聊天室？">
    <meta property="og:description" content="未公开的通讯窗口。">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style-modern.css" id="css-modern">
    <link rel="stylesheet" href="style-retro.css" id="css-retro" disabled>
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="hidden.css">
</head>
<body data-page="hidden" data-hidden="mid" data-hidden-kind="chat" data-theme="modern">
    <div class="desktop-icons" aria-hidden="true">
        <a href="forum.html"><span class="ico">▤</span>我的电脑</a>
        <a href="admin.html"><span class="ico">▣</span>管理员登录</a>
        <a href="forum.html#about"><span class="ico">✎</span>说明.txt</a>
    </div>

    <div class="shell shell--narrow">
        <header class="mast mast--compact" data-window="📂 #001">
            <p class="kicker">奇闻异事 · 论坛存档</p>
            <nav class="top">
                <a href="secret.html">← 返回</a>
                <a href="forum.html">首页</a>
                <span class="spacer"></span>
                <button type="button" class="theme-switch" data-theme-toggle title="切换风格">
                    <span data-theme-label>风格</span>
                </button>
            </nav>
            <hr class="hairline">
        </header>

        <main class="feed" data-window="📂 #001 - 通讯已建立">
            <div class="chat">
                <div class="chat__bar">
                    <span class="chat__status">在线</span>
                    <button type="button" class="btn btn--quiet chat__login" id="loginBtn">登录</button>
                </div>

                <div class="chat__log" id="chatMessages" aria-live="polite">
                    <div class="msg-system">——— 通讯已建立 ———</div>
                </div>

                <form class="chat__form" id="chatForm">
                    <input class="field" type="text" id="chatInput" placeholder="输入消息..." autocomplete="off"
                           aria-label="输入消息">
                    <button type="submit" class="btn btn--primary">发送</button>
                </form>
            </div>
        </main>

        <footer class="foot">
            <span>奇闻异事 · 民间怪谈存档</span>
            <span>维护期间只读</span>
        </footer>
    </div>

    <div class="taskbar" aria-hidden="true">
        <span class="start"><span class="flag"></span>开始</span>
        <span class="task is-active">📂 #001</span>
        <span class="task">奇闻异事</span>
        <span class="clock" id="clock">--:--</span>
    </div>

    <script type="module" src="js/hidden.js"></script>
</body>
</html>
