<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇闻异事 - 首页</title>

    <meta name="description" content="奇闻异事，一个收集身边怪事的民间小站。旧帖仍可翻阅。">
    <meta name="theme-color" content="#1a73e8">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="奇闻异事">
    <meta property="og:title" content="奇闻异事">
    <meta property="og:description" content="奇闻异事，一个收集身边怪事的民间小站。旧帖仍可翻阅。">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style-modern.css" id="css-modern">
    <link rel="stylesheet" href="style-retro.css" id="css-retro" disabled>
    <link rel="stylesheet" href="ui.css">
</head>
<body data-page="home">
    <div class="container">
        <header>
            <h1>奇闻异事</h1>
            <nav>
                <a href="index.html">首页</a>
                <a href="admin.html">管理后台</a>
                <button type="button" class="theme-switch" data-theme-toggle title="切换风格">
                    <span data-theme-label>风格</span>
                </button>
            </nav>
        </header>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索帖子标题或内容...">
            <button type="button" id="searchBtn">🔍 搜索</button>
            <button type="button" id="clearSearchBtn" class="btn-small">清除</button>
        </div>
        <div id="searchResult" style="display:none;"></div>

        <!-- 发帖区：站点维护中，提交只会看到说明 -->
        <form class="post-form" id="postForm" novalidate>
            <h2>发布新帖</h2>
            <p class="form-note">本站正在维护，暂时无法发布新内容。已有帖子仍可正常阅读。</p>

            <input type="text" id="nickname" placeholder="你的昵称（可选）" maxlength="20">
            <input type="text" id="title" placeholder="帖子标题（不超过100字）" maxlength="100">
            <textarea id="content" placeholder="帖子内容（不超过5000字）" maxlength="5000"></textarea>

            <button type="submit">发布帖子</button>
        </form>

        <p class="list-stats" id="listStats"></p>
        <div class="post-list" id="postList">
            <p class="empty-state">正在加载帖子...</p>
        </div>
        <div id="loadMore"></div>

        <noscript>
            <p class="empty-state">本站需要启用 JavaScript 才能显示内容。</p>
        </noscript>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
