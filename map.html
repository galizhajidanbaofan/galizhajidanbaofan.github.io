            <h1 class="detail__title">恸山局部图</h1>
            <p class="detail__meta">据姜生帖中所述方位、与县地名志「恸山，俗呼恸山坳，无定界」一条重绘。非官方测绘图。</p>

            <figure class="map">
                <svg viewBox="0 0 760 560" role="img" aria-labelledby="mapTitle mapDesc">
                    <title id="mapTitle">恸山局部地形示意图</title>
                    <desc id="mapDesc">恸山主峰位于图中央偏右，等高线由外向内收拢。东南侧谷地有一处村寨，标为姜家寨，寨中偏北为姜氏祠堂，祠堂之后有一口井。西侧有一条进山小路自镇子方向蜿蜒而上。</desc>

                    <rect class="map__frame" x="8" y="8" width="744" height="544"></rect>

                    <!-- 主峰等高线（手绘，非正圆） -->
                    <g class="map__contour">
                        <path d="M200 410 C150 340 170 250 250 205 C320 166 400 150 480 140 C560 130 640 160 665 220 C690 280 660 350 600 390 C540 430 460 450 380 455 C300 460 250 458 200 410 Z"></path>
                        <path d="M250 395 C210 345 225 270 290 235 C350 203 415 192 480 185 C545 178 605 200 625 248 C645 296 620 348 565 375 C510 402 445 415 385 415 C320 415 285 425 250 395 Z"></path>
                        <path d="M300 375 C270 338 282 285 335 258 C385 232 435 225 485 222 C535 219 578 238 590 272 C602 306 580 340 538 358 C496 376 448 385 402 383 C355 381 325 398 300 375 Z"></path>
                        <path d="M348 352 C328 328 336 292 375 272 C412 253 450 248 485 250 C520 252 548 266 553 290 C558 314 540 336 512 346 C484 356 452 360 420 357 C388 354 366 372 348 352 Z"></path>
                        <path d="M392 325 C380 310 386 288 412 277 C436 267 462 266 480 272 C498 278 505 292 498 306 C491 320 470 328 450 327 C430 326 402 338 392 325 Z"></path>
                    </g>

                    <!-- 山脊线 -->
                    <path class="map__ridge" d="M250 320 C320 285 355 250 400 214 C438 184 470 168 512 150"></path>

                    <!-- 副峰 -->
                    <g class="map__contour map__contour--thin">
                        <path d="M540 520 C520 486 545 455 585 442 C625 429 672 436 690 462 C708 488 690 516 655 524 C620 532 560 548 540 520 Z"></path>
                        <path d="M578 505 C566 486 582 468 608 462 C634 456 660 464 666 481 C672 498 656 512 634 514 C612 516 590 522 578 505 Z"></path>
                    </g>

                    <!-- 进山小路 -->
                    <path class="map__path" d="M52 528 C96 500 112 470 148 456 C182 443 196 436 214 418"></path>

                    <!-- 姜家寨 -->
                    <g class="map__village">
                        <path class="map__village-box" d="M126 372 L242 356 L254 424 L138 442 Z"></path>
                        <rect x="146" y="382" width="13" height="11"></rect>
                        <rect x="172" y="378" width="13" height="11"></rect>
                        <rect x="196" y="374" width="13" height="11"></rect>
                        <rect x="152" y="406" width="13" height="11"></rect>
                        <rect x="180" y="402" width="13" height="11"></rect>
                        <rect x="208" y="398" width="13" height="11"></rect>
                    </g>

                    <!-- 祠堂 -->
                    <g class="map__hall">
                        <rect x="234" y="352" width="20" height="16"></rect>
                    </g>

                    <!-- 井 -->
                    <g class="map__well">
                        <circle cx="274" cy="330" r="5"></circle>
                        <path d="M274 325 L274 304 L310 304"></path>
                        <text x="316" y="308">井</text>
                    </g>

                    <!-- 标注 -->
                    <text class="map__label map__label--peak" x="424" y="176">恸山主峰</text>
                    <text class="map__label map__label--small" x="404" y="196">无定界 · 估高 1400m</text>
                    <text class="map__label" x="150" y="470">姜家寨</text>
                    <text class="map__label map__label--small" x="150" y="488">几十户，全姓姜</text>
                    <text class="map__label map__label--small" x="262" y="366">姜氏祠堂</text>
                    <text class="map__label map__label--small" x="64" y="516">自镇子步行上山</text>
                    <text class="map__label map__label--small" x="596" y="470">西岭</text>

                    <!-- 指北针 -->
                    <g class="map__compass">
                        <path d="M690 96 L690 52"></path>
                        <path d="M690 52 L682 66 L698 66 Z"></path>
                        <text x="690" y="112">N</text>
                    </g>

                    <!-- 比例尺 -->
                    <g class="map__scale">
                        <path d="M566 520 L686 520"></path>
                        <path d="M566 514 L566 526"></path>
                        <path d="M626 514 L626 526"></path>
                        <path d="M686 514 L686 526"></path>
                        <text x="566" y="508">0</text>
                        <text x="614" y="508">1</text>
                        <text x="674" y="508">2 km</text>
                    </g>
                </svg>
                <figcaption>
                    <span>图例：细实线为等高线（每级约 200m），虚线为进山小路，方框为屋舍，标记「井」者为祠堂之后那口井。</span>
                    <span>井的位置是估的。她没说清在祠堂的哪一侧。</span>
                </figcaption>
            </figure>

            <p class="office__note">这张图我画了三遍。头两遍画完对着看，总觉得村子不该在那个位置——谷地朝向不对。第三遍按她描述的「进寨先看见祠堂的青石台阶」重新摆了一遍，才顺。</p>
