<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员口令哈希生成器（本地工具）</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px 60px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            color: #222;
            background: #f7f9fc;
        }
        h1 { font-size: 20px; }
        p { font-size: 14px; color: #555; }
        input, button {
            font: inherit;
            padding: 8px 12px;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
        }
        input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #1a73e8; color: #fff; border-color: #1a73e8; cursor: pointer; }
        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 150px;
            margin-top: 14px;
            padding: 12px;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            background: #fff;
        }
        .hint { font-size: 13px; color: #777; }
    </style>
</head>
<body>
    <h1>管理员口令哈希生成器</h1>
    <p>
        输入新口令，生成 PBKDF2-SHA256 凭据，粘贴进 <code>js/config.js</code> 的
        <code>admin.credentials</code> 数组即可。整个过程只在你的浏览器里跑，
        口令不会被发送到任何地方。
    </p>
    <p class="hint">
        注意：静态站没有后端，这道门只是叙事上的门槛——任何人下载
        <code>data/archive.json</code> 都能看到里面的文字。所以别把真正的秘密放进去。
    </p>

    <input type="password" id="password" placeholder="输入新口令" autocomplete="new-password">
    <button type="button" id="generate">生成凭据</button>
    <textarea id="output" readonly placeholder="生成结果会出现在这里"></textarea>

    <p class="hint" style="margin-top:14px;">
        生成后记得清空这个输入框；也别忘了把 <code>js/config.js</code> 里旧的
        <code>sha256</code> 凭据删掉。
    </p>

    <script>
        const toHex = (buffer) => Array.from(new Uint8Array(buffer))
            .map((b) => b.toString(16).padStart(2, '0')).join('');

        document.getElementById('generate').addEventListener('click', async () => {
            const password = document.getElementById('password').value;
            const output = document.getElementById('output');

            if (!password) {
                output.value = '口令不能为空。';
                return;
            }

            const iterations = 150000;
            const saltBytes = crypto.getRandomValues(new Uint8Array(16));
            const salt = toHex(saltBytes);

            const key = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveBits']
            );
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' },
                key,
                256
            );

            const credential = {
                type: 'pbkdf2',
                salt,
                iterations,
                hash: toHex(bits)
            };

            output.value = JSON.stringify(credential, null, 4);
        });
    </script>
</body>
</html>
